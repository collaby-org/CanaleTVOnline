<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060914"/>
      <stop offset="100%" style="stop-color:#0c1a3a"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff1744"/>
      <stop offset="100%" style="stop-color:#ff4569"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Red glow -->
  <ellipse cx="600" cy="315" rx="400" ry="280" fill="#ff1744" opacity="0.06"/>
  <!-- Logo box -->
  <rect x="80" y="200" width="100" height="100" rx="22" fill="url(#red)"/>
  <text x="130" y="265" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle">TV</text>
  <!-- Main title -->
  <text x="80" y="360" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">CanaleTV</text>
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="76" font-weight="900" fill="#ff1744" letter-spacing="-1">LIVE</text>
  <!-- Subtitle -->
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="28" fill="#8896b3">TV Online Gratuit · Fără Abonament · Direct în Browser</text>
  <!-- Live badge -->
  <rect x="800" y="240" width="120" height="42" rx="10" fill="#ff1744"/>
  <circle cx="824" cy="261" r="6" fill="white" opacity="0.9"/>
  <text x="880" y="268" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">LIVE</text>
  <!-- Channel count -->
  <text x="800" y="330" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="white">37+</text>
  <text x="800" y="375" font-family="Arial, sans-serif" font-size="22" fill="#8896b3">Canale TV Live</text>
  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#ff1744" opacity="0.15"/>
  <text x="600" y="616" font-family="Arial, sans-serif" font-size="20" fill="#8896b3" text-anchor="middle">canaletvlive.online</text>
</svg>